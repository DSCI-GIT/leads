name: Deploy DSCI Lead Intelligence to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

environment:
  name: github-pages
  url: ${{ steps.deployment.outputs.page_url }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate lead dataset
        run: python scripts/validate_dataset.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare publication directory
        run: |
          rm -rf _site
          mkdir _site
          cp index.html 404.html leads.json leads.csv manifest.json robots.txt .nojekyll _site/

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
